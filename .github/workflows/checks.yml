name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r remote_app/requirements.txt
      - run: python -m unittest discover -s remote_app/tests -v
      - run: node --check remote_app/static/app.js && node --check remote_app/static/games.js
      - run: python esp32_led_standalone/prepare_assets.py && git diff --exit-code
